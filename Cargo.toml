[workspace]
members = ["crates/forge", "crates/forge-cli"]
default-members = ["crates/forge-cli"]
resolver = "2"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
pulldown-cmark = { version = "0.13", features = ["serde"] }
tera = "1.19"
rayon = "1.8"
once_cell = "1.19"
ignore = "0.4"
walkdir = "2.5"
num_cpus = "1.16"
memchr = "2.7"
flate2 = "1.0"
bincode = "1.3"
mime_guess = "2.0"
parking_lot = "0.12"
ctrlc = "3.4"
warp = "0.3"
tokio = { version = "1.43", features = ["full"] }
notify = "6.1"
minify-html = "0.15"
