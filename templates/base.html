<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.title | default(value="Rust Blog") }}{% endblock title %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {

            /* Dynamic color adjustments mapped from blog.toml configurations */
            --primary-color: {
                    {
                    config.theme_settings.primary_color | default(value="#3b82f6")
                }
            }

            ;
            --primary-gradient: linear-gradient(135deg, var(--primary-color) 0%, #7c3aed 100%);

            --text-main: #1f2937;
            --text-muted: #4b5563;
            --text-light: #9ca3af;
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --link-color: var(--primary-color);
            --link-hover: #1d4ed8;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05),
            0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1),
            0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.7;
            color: var(--text-main);
            max-width: 850px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: var(--bg-body);
            -webkit-font-smoothing: antialiased;
        }

        header {
            background: var(--primary-gradient);
            color: white;
            padding: 3.5rem 2rem;
            border-radius: var(--radius-lg);
            margin-bottom: 2.5rem;
            text-align: center;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
            pointer-events: none;
        }

        header h1 {
            color: #ffffff;
            margin-bottom: 0.75rem;
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.05em;
        }

        header p {
            font-size: 1.15rem;
            opacity: 0.9;
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
        }

        .container {
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }

        h1,
        h2,
        h3,
        h4 {
            font-weight: 700;
            color: #111827;
        }

        h2 {
            font-size: 1.8rem;
            margin: 2rem 0 1.2rem 0;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 0.6rem;
        }

        p {
            margin-bottom: 1.2rem;
            font-size: 1.05rem;
        }

        a {
            color: var(--link-color);
            text-decoration: none;
            transition: var(--transition);
        }

        a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        .post-meta {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .post-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .post-item {
            padding: 2rem;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid #e5e7eb;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .post-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: #d1d5db;
        }

        .post-title {
            font-size: 1.65rem;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .post-title a {
            color: #111827;
        }

        .post-title a:hover {
            color: var(--link-color);
            text-decoration: none;
        }

        .post-excerpt {
            color: var(--text-muted);
            margin-bottom: 1.2rem;
            font-size: 1rem;
        }

        .read-more {
            color: var(--link-color);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .read-more:hover {
            gap: 0.5rem;
            text-decoration: none;
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid #e5e7eb;
            color: var(--text-light);
            font-size: 0.875rem;
        }

        footer p {
            margin-bottom: 0.5rem;
        }

        @media (max-width: 640px) {
            body {
                padding: 15px 10px;
            }

            header {
                padding: 2.5rem 1rem;
                margin-bottom: 1.5rem;
                border-radius: var(--radius-md);
            }

            header h1 {
                font-size: 2rem;
            }

            .container {
                padding: 1.5rem;
                border-radius: var(--radius-md);
            }

            .post-item {
                padding: 1.5rem;
            }

            .post-title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>🚀 {{ config.title | default(value="Rust Blog") }}</h1>
        <p>{{ config.description | default(value="Static site generator built with Rust") }}</p>
    </header>

    <main class="container">
        {% block content %}{% endblock content %}
    </main>

    <footer>
        <p>Generated: {{ generated_at }} | Version: {{ version | default(value="0.1.0") }}</p>
        <p>Powered by Rust & Tera</p>
    </footer>
</body>

</html>
