# Rust Blog Core Configuration

title = "Rust Blog"
description = "High performance static blog framework built with pure Rust."
author = "Your Name"
language = "zh-CN"
base_url = "https://yourdomain.com"
theme = "default"

[output]
dir = "public"
clean_build = true

[theme_settings]
primary_color = "#3b82f6"
dark_mode = true

[markdown]
smart_punctuation = true
highlight_code = true
syntax_theme = "github-dark"

[templates]
dir = "templates"
engine = "tera"

[server]
port = 8080
host = "127.0.0.1"
live_reload = true

[social]
github = "yourname"
twitter = "yourhandle"
email = "your@email.com"

[extra]
show_rss = true
show_sitemap = true
show_search = true
